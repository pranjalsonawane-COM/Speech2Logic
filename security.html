<div class="container">

<h1>Security Analyzer</h1>

<p>This module checks developer code for basic security issues.</p>

<textarea id="code" rows="10" cols="80" placeholder="Paste code here"></textarea>

<br>

<button onclick="checkSecurity()">Analyze Security</button>

<div class="box">

<h3>Security Report</h3>

<p id="report"></p>

</div>

</div>

<script>

function checkSecurity(){

let code=document.getElementById("code").value;

let report="";

if(code.includes("password")){
report+="⚠ Hardcoded password detected\n";
}

if(code.includes("eval(")){
report+="⚠ Use of eval() may cause security risk\n";
}

if(report===""){
report="✅ No basic security issues detected";
}

document.getElementById("report").innerText=report;

}

</script>

</body>
